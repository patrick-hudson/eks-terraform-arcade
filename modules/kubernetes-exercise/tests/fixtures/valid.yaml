--- # real YAML document boundary
apiVersion: v1
kind: Namespace
metadata:
  name: arcade-contract
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: arcade-contract
data:
  script: |
    echo --- is data
    ---
    echo end
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: arcade-contract
spec:
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      containers:
        - name: app
          image: alpine:3.24.2
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: arcade-contract
spec:
  selector: {app: demo}
  ports:
    - port: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: check
  namespace: arcade-contract
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: alpine:3.24.2
          command: ["true"]
