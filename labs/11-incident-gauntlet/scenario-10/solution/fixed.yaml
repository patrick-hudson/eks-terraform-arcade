---
apiVersion: v1
kind: Namespace
metadata:
  name: arcade-incident-10
  labels:
    app.kubernetes.io/part-of: aws-interview-arcade
    arcade-lab: '11'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: arcade-incident-10
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: incident
  template:
    metadata:
      labels:
        app: incident
      annotations:
        arcade-release: arcade-10-v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: public.ecr.aws/docker/library/python:3.14.8-alpine
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -u
        - -c
        - |
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = (os.environ["RELEASE"] + "\n").encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)

          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
        env:
        - name: RELEASE
          value: arcade-10-v2
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 1000m
            memory: 32Mi
          limits:
            cpu: 1000m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 3
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
      nodeSelector:
        role: lab
        node.kubernetes.io/instance-type: t3.medium
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: arcade-incident-10
spec:
  type: ClusterIP
  selector:
    app: incident
  ports:
  - name: http
    port: 8080
    targetPort: http
