<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17251f">
    <meta name="description" content="A local workspace for Terraform, AWS and EKS interview practice. Build infrastructure, diagnose failures, and explain your decisions.">
    <title>AWS Interview Arcade</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/workspace.css">
    <script src="/vendor/marked.umd.js" defer></script>
    <script src="/vendor/purify.min.js" defer></script>
    <script src="/practice-core.js" defer></script>
    <script src="/verification-core.js" defer></script>
    <script src="/core.js" defer></script>
    <script src="/launcher-core.js" defer></script>
    <script src="/launcher.js" defer></script>
    <script src="/verification.js" defer></script>
    <script src="/practice.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside id="sidebar" class="sidebar" aria-label="Workspace navigation"></aside>
    <button id="sidebar-overlay" class="sidebar-overlay" aria-label="Close navigation" tabindex="-1"></button>
    <div class="workspace">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="breadcrumb" id="topbar-title">Lab directory</div>
        <div class="topbar-status"><span class="status-dot" aria-hidden="true"></span>Local workspace</div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading-state" role="status"><span class="loading-mark" aria-hidden="true"></span><p>Opening your workspace…</p></div>
        <noscript><div class="error-state"><h1>JavaScript is needed for the lab reader.</h1><p>You can still work through the original README and lab files in this project folder.</p></div></noscript>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="storage-warning" class="storage-warning" hidden role="status"></div>
  </body>
</html>
